<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Ace Flight Planner</title>
</head>
<body>
    <header class="level site-header">
        <h1 class="title is-1 level-item has-text-centered">Ace Flight Planner</h1>
    </header>

    <section class="hero is-medium is-success level" aria-labelledby="hero-heading">
        <div class="level-item has-text-centered">
            <h2 id="hero-heading" class="title is-2">Allows us to help guide you on your journey to unknown places...</h2>
        </div>
    </section>

    <main class="tile is-ancestor is-vertical">
        <section class="tile is-parent notification is-primary is-fullhd level-item img2" aria-labelledby="flight-heading">
            <h2 id="flight-heading" class="title is-2 has-text-success">Flight Rates</h2>

            <form id="airport-search-form" class="flight control" novalidate>
                <label class="label" for="searchairports">Find an airport</label>
                <div class="field has-addons">
                    <div class="control is-expanded">
                        <input type="search" placeholder="Search by city, region, or country" id="searchairports" class="input" autocomplete="off">
                    </div>
                    <div class="control">
                        <button id="searchairportsbtn" class="button is-link" type="submit">Search airports</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="searchedairbtn" class="button is-link" type="button">View searched airports</button>
                    <button id="deletehistorybtn" class="button is-link" type="button">Delete search history</button>
                </div>
                <ol id="airportsearchresults" aria-live="polite"></ol>
                <ul id="searchhistory" aria-live="polite"></ul>
            </form>

            <form id="flight-search-form" class="flight control" novalidate>
                <div class="columns">
                    <div class="column">
                        <label class="label" for="from-flight">Departure airport</label>
                        <input type="text" placeholder="e.g. OAK" id="from-flight" class="input" maxlength="3" pattern="[A-Za-z]{3}" autocomplete="off" required>
                    </div>
                    <div class="column">
                        <label class="label" for="from-date">Departure date</label>
                        <input type="date" id="from-date" class="input" required>
                    </div>
                </div>
                <div class="columns">
                    <div class="column">
                        <label class="label" for="to-flight">Arrival airport</label>
                        <input type="text" placeholder="e.g. JFK" id="to-flight" class="input" maxlength="3" pattern="[A-Za-z]{3}" autocomplete="off" required>
                    </div>
                    <div class="column">
                        <label class="label" for="return-date">Return date <span class="has-text-weight-normal">(optional)</span></label>
                        <input type="date" id="return-date" class="input">
                    </div>
                </div>
                <button id="flight-quotes" class="button is-link" type="submit">Get flight quotes</button>
            </form>

            <ul id="resuling-flight" class="result-list" aria-live="polite"></ul>
            <ul id="countrycurrency" class="result-list" aria-live="polite"></ul>
            <div id="errormodal" class="moda" role="dialog" aria-modal="true" aria-labelledby="error-heading" hidden>
                <div class="moda-content">
                    <button class="close" id="error-close" type="button" aria-label="Close error message">&times;</button>
                    <p id="error-heading">No results found. Try another airport, date, or try again later.</p>
                </div>
            </div>
        </section>

        <section class="tile is-parent notification is-warning is-fullhd level-item img1 control" id="currency" aria-labelledby="currency-heading">
            <h2 id="currency-heading" class="title is-2 has-text-warning">Currency Exchange Rates</h2>
            <form id="currency-form" novalidate>
                <div class="field">
                    <label class="label" for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" class="input" min="0" step="any" required>
                </div>
                <div class="columns">
                    <div class="column from-currency">
                        <label class="label" for="from-currency">From</label>
                        <select id="from-currency" name="from-currency" class="currency-choices" required></select>
                    </div>
                    <div class="column to-currency">
                        <label class="label" for="to-currency">To</label>
                        <select id="to-currency" name="to-currency" class="currency-choices" required></select>
                    </div>
                </div>
                <button id="currency-exchange" class="button is-link" type="submit">Get exchange rate</button>
            </form>
            <div id="result" class="moda" role="dialog" aria-modal="true" aria-labelledby="result-heading" hidden>
                <div class="moda-content">
                    <button class="close" id="result-close" type="button" aria-label="Close exchange result">&times;</button>
                    <p id="result-heading"></p>
                </div>
            </div>
        </section>
    </main>

    <script src="./assets/js/countries.js" defer></script>
    <script src="./assets/js/countries00.js" defer></script>
    <script src="./assets/js/script.js" defer></script>
</body>
</html>
